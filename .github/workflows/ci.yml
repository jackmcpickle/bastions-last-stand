name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install gdtoolkit
      - name: Check formatting
        run: gdformat --check simulation/ tests/ resources/ maps/ ui/ game/ main.gd
      - name: Lint
        run: gdlint simulation/ tests/ resources/ maps/ ui/ game/ main.gd

  godot-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
      - name: Install GUT
        run: |
          # Gut repo nests the addon under addons/gut; copy that tree into place.
          # Pin to 9.3.1 for Godot 4.3 (newer GUT targets Godot 4.6+).
          git clone --depth 1 --branch 9.3.1 https://github.com/bitwes/Gut.git /tmp/gut
          mkdir -p addons
          cp -r /tmp/gut/addons/gut addons/gut
      - name: Import project
        # First headless run generates .godot/ so scripts/resources resolve.
        run: godot --headless --import || true
      - name: Run tests
        run: godot --headless -s addons/gut/gut_cmdln.gd -gdir=res://tests -gexit

  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: balance_ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest
